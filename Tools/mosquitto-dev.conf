# Development-only Mosquitto config for MyRoboticsInspector testing.
# Run via Tools/start-broker.cmd
#
# Listens on all interfaces (so a tablet on the same LAN can also connect),
# allows anonymous (no auth) — DO NOT USE IN PRODUCTION.

listener 1883 0.0.0.0
allow_anonymous true

# Persist retained messages between restarts (so status/online retains stick).
persistence true
persistence_location ./

# Verbose logging to stdout for debugging.
log_dest stdout
log_type all
connection_messages true
